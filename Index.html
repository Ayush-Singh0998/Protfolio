  <title>Raghav-Portfolio</title>
   <style>/* Basic reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

/* Body styling */
body {
  background: linear-gradient(135deg, #1e1e2f, #2c2c54);
  color: white;
  text-align: center;
  padding: 20px;
}

/* Heading */
h1 {
  font-size: 32px;
  margin-bottom: 10px;
  color: #00ffd5;
}

h2 {
  margin-top: 20px;
  color: #ffcc00;
}

/* Paragraph (fix kar: para -> p) */
p {
  margin: 10px 0;
  font-size: 16px;
  color: #ddd;
}

/* Button link */
a {
  display: inline-block;
  margin-top: 15px;
  padding: 10px 20px;
  background: #00ffd5;
  color: black;
  text-decoration: none;
  border-radius: 20px;
  font-weight: bold;
  transition: 0.3s;
}

a:hover {
  background: #00bfa6;
  transform: scale(1.05);
}

/* Gift section */
div {
  margin-top: 15px;
}</style>
</head>
